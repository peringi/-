<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ウミガメのスープ - 1ファイル版</title>
  <meta name="description" content="AI不要・1ファイルで遊べるウミガメのスープ（水平思考クイズ）" />
  <style>
    :root{
      --bg:#07111f;
      --panel:#101c2d;
      --panel2:#0a1625;
      --line:#243954;
      --text:#f5f7fb;
      --muted:#96a8c0;
      --accent:#65ddcf;
      --accent2:#78a8ff;
      --yes:#63dfb3;
      --no:#ff8c99;
      --gold:#ffd36f;
      --shadow:0 20px 65px rgba(0,0,0,.30);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 0%,rgba(101,221,207,.11),transparent 28%),
        radial-gradient(circle at 85% 0%,rgba(120,168,255,.12),transparent 28%),
        var(--bg);
    }
    button,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:980px;margin:0 auto;padding:18px 16px 46px}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#05101b;font-size:25px;box-shadow:var(--shadow)
    }
    h1{margin:0;font-size:22px}
    .sub{margin-top:4px;color:var(--muted);font-size:12px}
    .ghost,.primary{
      border-radius:14px;padding:12px 15px;font-weight:800
    }
    .ghost{
      border:1px solid var(--line);background:#13233a;color:var(--text)
    }
    .primary{
      width:100%;border:0;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#06111c;margin-top:10px
    }
    .layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:16px}
    .card{
      background:rgba(16,28,45,.95);border:1px solid var(--line);border-radius:var(--radius);
      padding:20px;box-shadow:var(--shadow)
    }
    .meta{display:flex;gap:8px;flex-wrap:wrap}
    .tag{
      padding:7px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
      color:var(--muted);font-size:12px
    }
    .problem-title{font-size:26px;margin:16px 0 8px}
    .problem-text{font-size:16px;line-height:1.9;color:#e7edf5;margin:0}
    textarea{
      margin-top:20px;width:100%;min-height:112px;resize:vertical;
      border:1px solid var(--line);border-radius:16px;background:#071321;color:var(--text);
      padding:14px;outline:none;line-height:1.7
    }
    textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(120,168,255,.12)}
    .answer{
      margin-top:14px;min-height:64px;display:grid;place-items:center;text-align:center;
      border:1px solid var(--line);border-radius:16px;background:#091522;
      padding:14px;font-weight:900;font-size:20px
    }
    .answer.idle{color:var(--muted);font-size:14px;font-weight:600}
    .answer.yes{color:var(--yes)}
    .answer.no{color:var(--no)}
    .answer.neutral{color:#c8d3e2}
    .answer.correct{color:var(--gold)}
    .answer.hint{color:var(--gold);font-size:15px}
    .tools{display:flex;gap:10px;margin-top:10px}
    .tools button{flex:1}
    .truth{
      margin-top:14px;padding:16px;border-radius:16px;
      background:rgba(255,211,111,.08);border:1px solid rgba(255,211,111,.32)
    }
    .truth strong{color:var(--gold)}
    .truth p{line-height:1.8;margin-bottom:0}
    .hidden{display:none}
    .side-title{font-weight:900;margin-bottom:12px}
    .history{display:flex;flex-direction:column;gap:8px;max-height:500px;overflow:auto}
    .history-row{
      padding:11px;border-radius:13px;background:#0b1726;border:1px solid var(--line)
    }
    .history-q{font-size:13px;line-height:1.5;color:#dce5f0}
    .history-a{font-size:12px;font-weight:900;color:var(--accent);margin-top:5px}
    .history-a.correct{color:var(--gold)}
    .muted{color:var(--muted);font-size:13px;line-height:1.65}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .stat{text-align:center;padding:12px;border-radius:14px;background:#0b1726;border:1px solid var(--line)}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:11px;color:var(--muted)}
    .ad{
      margin-top:14px;border:1px dashed #3a5275;border-radius:15px;padding:16px;
      color:#7f94b2;text-align:center;font-size:12px;background:rgba(255,255,255,.02)
    }
    footer{margin-top:16px;color:#6e829c;text-align:center;font-size:11px;line-height:1.7}
    @media(max-width:760px){
      .layout{grid-template-columns:1fr}
      header{align-items:flex-start}
      .problem-title{font-size:22px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🐢</div>
      <div>
        <h1>ウミガメのスープ</h1>
        <div class="sub">AIなし・1ファイル完結版</div>
      </div>
    </div>
    <button id="newGame" class="ghost">新しい問題</button>
  </header>

  <div class="layout">
    <main class="card">
      <div class="meta">
        <span class="tag" id="difficulty"></span>
        <span class="tag" id="category"></span>
        <span class="tag" id="progress"></span>
      </div>

      <h2 class="problem-title" id="title"></h2>
      <p class="problem-text" id="statement"></p>

      <textarea id="question" maxlength="300"
        placeholder="自由に質問、または真相を推理して入力してください。例：男が外に出たとき、雨は降っていましたか？"></textarea>
      <button id="ask" class="primary">質問する / 推理する</button>

      <div id="answerBox" class="answer idle">
        質問すると「はい・いいえ・関係ありません」で答えます。
      </div>

      <div class="tools">
        <button id="hint" class="ghost">💡 ヒント</button>
        <button id="reveal" class="ghost">答えを見る</button>
      </div>

      <div id="truth" class="truth hidden"></div>
    </main>

    <aside class="card">
      <div class="side-title">質問履歴</div>
      <div id="history" class="history">
        <p class="muted">まだ質問はありません。</p>
      </div>

      <div class="stats">
        <div class="stat"><b id="questionCount">0</b><span>質問</span></div>
        <div class="stat"><b id="hintCount">0</b><span>ヒント</span></div>
        <div class="stat"><b id="clearCount">0</b><span>クリア</span></div>
      </div>

      <div class="ad">
        広告スペース<br>
        将来AdSense等のコードへ差し替え可能
      </div>

      <p class="muted" style="margin-top:14px">
        この版はAIを使わず、問題ごとに設定したキーワードとルールで質問を判定します。
        そのため完全自由な文章理解ではありませんが、APIキー不要でそのまま公開できます。
      </p>
    </aside>
  </div>

  <footer>
    ブラウザだけで動作します。サーバー・APIキー・外部ライブラリ不要。
  </footer>
</div>

<script>
const problems = [
  {
    id:"rain",
    title:"濡れなかった男",
    statement:"男は雨の日に傘を持たずに家を出た。しかし、服も髪もまったく濡れなかった。なぜ？",
    answer:"その日は雨の日だったが、男が外に出た時間には雨が止んでいた。",
    difficulty:"初級",
    category:"日常",
    hints:[
      "男は特別な道具を使っていません。",
      "『雨の日』と『外に出た瞬間に雨が降っている』は同じとは限りません。"
    ],
    successGroups:[
      ["雨","止"],
      ["雨","やん"],
      ["降って","いな"],
      ["時間","雨"]
    ],
    rules:[
      {keys:["雨","降って"], answer:"はい"},
      {keys:["止","やん"], answer:"はい"},
      {keys:["時間","朝","昼","夜"], answer:"はい"},
      {keys:["傘"], answer:"いいえ"},
      {keys:["屋根","地下","車","タクシー"], answer:"いいえ"},
      {keys:["レインコート","防水"], answer:"いいえ"},
      {keys:["濡れ"], answer:"はい"}
    ]
  },
  {
    id:"restaurant",
    title:"注文しなかった男",
    statement:"男はレストランに入り、メニューを見た直後、何も注文せずに店を出た。男は怒っておらず、お金がないわけでもない。なぜ？",
    answer:"男は特定の料理を食べられる店を探しており、その料理がメニューにないと分かったため店を出た。",
    difficulty:"中級",
    category:"状況",
    hints:[
      "店員とのトラブルではありません。",
      "男には店に入る前から、ある目的がありました。"
    ],
    successGroups:[
      ["料理","メニュー","ない"],
      ["食べたい","なかった"],
      ["探して","料理"],
      ["目的","メニュー"]
    ],
    rules:[
      {keys:["料理","食べ物","メニュー"], answer:"はい"},
      {keys:["探","目的"], answer:"はい"},
      {keys:["店員","怒"], answer:"いいえ"},
      {keys:["お金","財布"], answer:"いいえ"},
      {keys:["予約","満席","待ち時間"], answer:"いいえ"},
      {keys:["アレルギー","嫌い"], answer:"関係ありません"},
      {keys:["店","間違"], answer:"はい"}
    ]
  },
  {
    id:"clap",
    title:"誰もいない拍手",
    statement:"女は一人きりの部屋で拍手をした。その直後、安心して眠りについた。なぜ？",
    answer:"女の部屋には音に反応してオン・オフできる照明があり、拍手で照明を消したので眠りについた。",
    difficulty:"上級",
    category:"ひらめき",
    hints:[
      "拍手は誰かを称えるためではありません。",
      "拍手によって発生する『音』が重要です。"
    ],
    successGroups:[
      ["拍手","電気","消"],
      ["音","照明","消"],
      ["音","ライト","消"],
      ["拍手","明かり","消"]
    ],
    rules:[
      {keys:["音","拍手"], answer:"はい"},
      {keys:["電気","照明","ライト","明かり"], answer:"はい"},
      {keys:["消","暗"], answer:"はい"},
      {keys:["センサー","機械"], answer:"はい"},
      {keys:["人","泥棒","誰か"], answer:"いいえ"},
      {keys:["安心"], answer:"はい"}
    ]
  },
  {
    id:"elevator",
    title:"10階で降りる男",
    statement:"男は20階に住んでいる。晴れの日はエレベーターで10階まで行き、そこから階段で20階まで上がる。雨の日は20階までエレベーターで行く。なぜ？",
    answer:"男は背が低く、普段は10階のボタンまでしか届かない。雨の日は傘を使って20階のボタンを押せる。",
    difficulty:"中級",
    category:"定番",
    hints:[
      "男の身長が関係します。",
      "雨の日に持っている物が重要です。"
    ],
    successGroups:[
      ["背","低","10階"],
      ["身長","低","ボタン"],
      ["傘","20階","押"],
      ["届か","傘"]
    ],
    rules:[
      {keys:["身長","背","低"], answer:"はい"},
      {keys:["傘"], answer:"はい"},
      {keys:["ボタン","届"], answer:"はい"},
      {keys:["故障","壊"], answer:"いいえ"},
      {keys:["運動","健康"], answer:"いいえ"},
      {keys:["雨"], answer:"はい"}
    ]
  },
  {
    id:"photo",
    title:"写真を見て泣く男",
    statement:"男は一枚の写真を見て泣いた。しかし写真に写っている人物は、男の家族でも友人でも恋人でもない。なぜ？",
    answer:"写真は昔の自分自身が写った写真だった。男は過去を思い出して泣いた。",
    difficulty:"初級",
    category:"人物",
    hints:[
      "写真に写っている人物は男と無関係ではありません。",
      "『家族でも友人でも恋人でもない』人物とは誰でしょう。"
    ],
    successGroups:[
      ["自分","写真"],
      ["昔","自分"],
      ["本人","写真"]
    ],
    rules:[
      {keys:["自分","本人"], answer:"はい"},
      {keys:["昔","過去"], answer:"はい"},
      {keys:["家族","友人","恋人"], answer:"いいえ"},
      {keys:["死","亡く"], answer:"関係ありません"}
    ]
  }
];

let current = 0;
let questionCount = 0;
let hintCount = 0;
let solved = false;
let clearCount = Number(localStorage.getItem("umigame_clear_count") || 0);

const $ = id => document.getElementById(id);

function normalize(text){
  return text
    .toLowerCase()
    .replace(/[！？!?,。、．・\s]/g,"")
    .replace(/[ァ-ン]/g, s => String.fromCharCode(s.charCodeAt(0)-0x60));
}

function render(){
  const p = problems[current];
  $("title").textContent = p.title;
  $("statement").textContent = p.statement;
  $("difficulty").textContent = "難易度：" + p.difficulty;
  $("category").textContent = "ジャンル：" + p.category;
  $("progress").textContent = `${current+1}/${problems.length}`;
  $("question").value = "";
  $("history").innerHTML = '<p class="muted">まだ質問はありません。</p>';
  $("truth").classList.add("hidden");
  $("truth").innerHTML = "";
  questionCount = 0;
  hintCount = 0;
  solved = false;
  $("questionCount").textContent = "0";
  $("hintCount").textContent = "0";
  $("clearCount").textContent = String(clearCount);
  setAnswer("質問すると「はい・いいえ・関係ありません」で答えます。","idle");
}

function setAnswer(text,type){
  $("answerBox").textContent = text;
  $("answerBox").className = "answer " + type;
}

function addHistory(q,a,isCorrect=false){
  const empty = $("history").querySelector(".muted");
  if(empty) empty.remove();
  const row = document.createElement("div");
  row.className = "history-row";

  const qEl = document.createElement("div");
  qEl.className = "history-q";
  qEl.textContent = "Q. " + q;

  const aEl = document.createElement("div");
  aEl.className = "history-a" + (isCorrect ? " correct" : "");
  aEl.textContent = isCorrect ? "✓ 正解" : a;

  row.append(qEl,aEl);
  $("history").prepend(row);
}

function isCorrectGuess(input,p){
  const t = normalize(input);
  return p.successGroups.some(group =>
    group.every(word => t.includes(normalize(word)))
  );
}

function judgeQuestion(input,p){
  const t = normalize(input);

  for(const rule of p.rules){
    const hitCount = rule.keys.filter(k => t.includes(normalize(k))).length;
    if(hitCount >= Math.min(2, rule.keys.length)) return rule.answer;
  }

  for(const rule of p.rules){
    if(rule.keys.some(k => t.includes(normalize(k)))) return rule.answer;
  }

  const questionLike = ["ですか","ますか","でしょうか","なの","か？","か?"];
  if(questionLike.some(k => input.includes(k))){
    return "関係ありません";
  }

  return "関係ありません";
}

function showTruth(answer,heading="真相"){
  const box = $("truth");
  box.innerHTML = "";
  const strong = document.createElement("strong");
  strong.textContent = heading;
  const p = document.createElement("p");
  p.textContent = answer;
  box.append(strong,p);
  box.classList.remove("hidden");
}

$("ask").addEventListener("click",()=>{
  if(solved) {
    setAnswer("この問題はクリア済みです。新しい問題へ進んでね。","correct");
    return;
  }

  const input = $("question").value.trim();
  if(!input){
    setAnswer("まず質問か推理を入力してね。","idle");
    return;
  }

  const p = problems[current];
  questionCount++;
  $("questionCount").textContent = String(questionCount);

  if(isCorrectGuess(input,p)){
    solved = true;
    clearCount++;
    localStorage.setItem("umigame_clear_count",String(clearCount));
    $("clearCount").textContent = String(clearCount);
    addHistory(input,"正解",true);
    setAnswer("🎉 正解！ 真相を言い当てた！","correct");
    showTruth(p.answer,"🎉 正解・真相");
    $("question").value = "";
    return;
  }

  const result = judgeQuestion(input,p);
  addHistory(input,result,false);
  if(result==="はい") setAnswer("はい","yes");
  else if(result==="いいえ") setAnswer("いいえ","no");
  else setAnswer("関係ありません","neutral");

  $("question").value = "";
});

$("hint").addEventListener("click",()=>{
  const p = problems[current];
  const idx = Math.min(hintCount,p.hints.length-1);
  setAnswer("💡 " + p.hints[idx],"hint");
  if(hintCount < p.hints.length) hintCount++;
  $("hintCount").textContent = String(hintCount);
});

$("reveal").addEventListener("click",()=>{
  if(confirm("真相を表示しますか？")){
    showTruth(problems[current].answer);
    setAnswer("真相を表示しました。","neutral");
  }
});

$("newGame").addEventListener("click",()=>{
  current = (current + 1) % problems.length;
  render();
});

$("question").addEventListener("keydown",e=>{
  if((e.ctrlKey || e.metaKey) && e.key==="Enter"){
    $("ask").click();
  }
});

render();
</script>
</body>
</html>
