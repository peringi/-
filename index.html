<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ウミガメのスープ 130問版</title>
<style>
:root{--bg:#07111f;--panel:#101c2d;--panel2:#0a1625;--line:#243954;--text:#f5f7fb;--muted:#96a8c0;--accent:#65ddcf;--accent2:#78a8ff;--yes:#63dfb3;--no:#ff8c99;--gold:#ffd36f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(101,221,207,.11),transparent 28%),radial-gradient(circle at 85% 0%,rgba(120,168,255,.12),transparent 28%),var(--bg)}
button,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;padding:18px 16px 46px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:25px}
h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:16px}
.card{background:rgba(16,28,45,.95);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 65px rgba(0,0,0,.28)}
.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px}
h2{font-size:26px;margin:16px 0 8px}.statement{font-size:16px;line-height:1.9;color:#e7edf5}
textarea{margin-top:20px;width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:16px;background:#071321;color:var(--text);padding:14px;outline:none;line-height:1.7}
.primary,.ghost{border-radius:14px;padding:12px 15px;font-weight:800}.primary{width:100%;border:0;margin-top:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111c}.ghost{border:1px solid var(--line);background:#13233a;color:var(--text)}
.answer{margin-top:14px;min-height:64px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);border-radius:16px;background:#091522;padding:14px;font-weight:900;font-size:20px}.idle{color:var(--muted);font-size:14px;font-weight:600}.yes{color:var(--yes)}.no{color:var(--no)}.neutral{color:#c8d3e2}.correct{color:var(--gold)}.hint{color:var(--gold);font-size:15px}
.tools{display:flex;gap:10px;margin-top:10px}.tools button{flex:1}.truth{margin-top:14px;padding:16px;border-radius:16px;background:rgba(255,211,111,.08);border:1px solid rgba(255,211,111,.32)}.truth strong{color:var(--gold)}.truth p{line-height:1.8;margin-bottom:0}.hidden{display:none}
.history{display:flex;flex-direction:column;gap:8px;max-height:470px;overflow:auto}.history-row{padding:10px;border-radius:12px;background:#0b1726;border:1px solid var(--line)}.history-q{font-size:13px;line-height:1.5}.history-a{font-size:12px;color:var(--accent);font-weight:900;margin-top:5px}.history-a.correct{color:var(--gold)}.muted{color:var(--muted);font-size:13px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{text-align:center;padding:12px;border-radius:14px;background:#0b1726;border:1px solid var(--line)}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.selector{width:100%;margin-bottom:12px;padding:10px;border-radius:12px;background:#0b1726;color:var(--text);border:1px solid var(--line)}
@media(max-width:760px){.layout{grid-template-columns:1fr}header{align-items:flex-start}h2{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🐢</div><div><h1>ウミガメのスープ</h1><div class="sub">AIなし・130問・1ファイル完結版</div></div></div><button id="next" class="ghost">次の問題</button></header>
<div class="layout">
<main class="card">
<div class="meta"><span id="difficulty" class="tag"></span><span id="category" class="tag"></span><span id="progress" class="tag"></span></div>
<h2 id="title"></h2><p id="statement" class="statement"></p>
<textarea id="question" maxlength="300" placeholder="自由に質問、または真相を推理して入力してください。"></textarea>
<button id="ask" class="primary">質問する / 推理する</button>
<div id="answerBox" class="answer idle">質問すると「はい・いいえ・関係ありません」で答えます。</div>
<div class="tools"><button id="hint" class="ghost">💡 ヒント</button><button id="reveal" class="ghost">答えを見る</button></div>
<div id="truth" class="truth hidden"></div>
</main>
<aside class="card">
<select id="selector" class="selector"></select>
<div style="font-weight:900;margin-bottom:12px">質問履歴</div>
<div id="history" class="history"><p class="muted">まだ質問はありません。</p></div>
<div class="stats"><div class="stat"><b id="qCount">0</b><span>質問</span></div><div class="stat"><b id="hCount">0</b><span>ヒント</span></div><div class="stat"><b id="cCount">0</b><span>クリア</span></div></div>
<p class="muted" style="margin-top:14px">130問すべてHTML内蔵。サーバー・APIキー不要。質問判定はキーワード方式なので、AIほど柔軟ではありません。</p>
</aside>
</div>
</div>
<script>

: [["模型", "ドア"], ["展示", "玄関"]], "yes": ["模型", "展示", "店"], "no": ["自宅", "泥棒", "鍵"]}, {"title": "壊れた時計", "statement": "壁の時計が止まっているのに、男は毎日その時計を見て時間を確認する。なぜ？", "answer": "時計は止まっているが、正午と深夜の1日2回だけ正しい時刻を示すので、その時刻を確認しているから。", "difficulty": "初級", "category": "論理", "hints": ["止まった時計でも正しい瞬間がある。", "1日2回。"], "success": [["一日", "2回"], ["正午", "深夜"]], "yes": ["2回", "正午", "深夜", "止"], "no": ["電池", "修理"]}, {"title": "空の財布", "statement": "男は財布が空なのを見て笑った。なぜ？", "answer": "財布に現金を入れず、すべてキャッシュレス決済を使っているので問題なかったから。", "difficulty": "初級", "category": "現代", "hints": ["お金がないわけではない。", "現金で払う必要がない。"], "success": [["キャッシュレス", "財布"], ["電子", "決済"]], "yes": ["キャッシュレス", "電子", "カード", "スマホ"], "no": ["無一文", "盗難"]}, {"title": "消えたケーキ", "statement": "冷蔵庫からケーキが消えたのに、家族全員が喜んだ。なぜ？", "answer": "誕生日の本人に見つからないよう、家族が別の場所に隠したから。", "difficulty": "初級", "category": "日常", "hints": ["盗まれたわけではない。", "見つからない方が都合がいい。"], "success": [["誕生日", "隠"], ["サプライズ", "ケーキ"]], "yes": ["誕生日", "隠", "サプライズ"], "no": ["盗難", "食べた"]}, {"title": "逆さまの本", "statement": "男は本を逆さまにして読んでいたが、誰も不思議に思わなかった。なぜ？", "answer": "男が読んでいたのは文字ではなく、逆さまでも見られる写真集だったから。", "difficulty": "初級", "category": "言葉", "hints": ["文字を読んでいたとは限らない。", "内容の種類が重要。"], "success": [["写真集", "逆さ"], ["写真", "本"]], "yes": ["写真", "写真集"], "no": ["外国語", "暗号"]}, {"title": "鳴らない目覚まし", "statement": "女は目覚まし時計をセットしたのに、一度も鳴らず、それでも予定通り起きた。なぜ？", "answer": "目覚ましが鳴る前に自然に目が覚めたので、鳴る前に止めたから。", "difficulty": "初級", "category": "日常", "hints": ["故障ではない。", "時計が鳴る必要がなかった。"], "success": [["自然", "起き"], ["鳴る前", "止"]], "yes": ["自然", "起", "前"], "no": ["故障", "電池"]}, {"title": "毎日遅刻する男", "statement": "男は毎日同じ時刻に家を出るのに、会社に着く時刻は毎日違う。それでも遅刻ではない。なぜ？", "answer": "男はタクシー運転手で、会社とは毎日異なる客の目的地のことではなく、自分の勤務先に戻る必要がない仕事だから。", "difficulty": "中級", "category": "仕事", "hints": ["一般的な会社員ではない。", "仕事の種類が重要。"], "success": [["タクシー", "運転手"], ["仕事", "移動"]], "yes": ["運転手", "タクシー", "仕事"], "no": ["渋滞", "遅刻"]}, {"title": "半分だけ食べる男", "statement": "男は毎日リンゴを必ず半分だけ食べ、残り半分は捨てる。それでも無駄遣いではない。なぜ？", "answer": "男はリンゴ農家で、味見のために傷のあるリンゴの一部だけを食べ、残りは堆肥にしているから。", let current=0,qCount=0,hCount=0,solved=false,clearCount=Number(localStorage.getItem("umigame130_clear")||0);
const $=id=>document.getElementById(id);
function norm(s){return String(s).toLowerCase().replace(/[！？!?,。、．・\s]/g,"").replace(/[ァ-ン]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function render(){const p=problems[current];$("title").textContent=p.title;$("statement").textContent=p.statement;$("difficulty").textContent="難易度："+p.difficulty;$("category").textContent="ジャンル："+p.category;$("progress").textContent=(current+1)+"/"+problems.length;$("selector").value=String(current);$("question").value="";$("history").innerHTML='<p class="muted">まだ質問はありません。</p>';$("truth").classList.add("hidden");$("truth").innerHTML="";qCount=0;hCount=0;solved=false;$("qCount").textContent="0";$("hCount").textContent="0";$("cCount").textContent=clearCount;setAns("質問すると「はい・いいえ・関係ありません」で答えます。","idle");}
function setAns(t,c){$("answerBox").textContent=t;$("answerBox").className="answer "+c}
function addHist(q,a,c=false){const m=$("history").querySelector(".muted");if(m)m.remove();const r=document.createElement("div");r.className="history-row";const qd=document.createElement("div");qd.className="history-q";qd.textContent="Q. "+q;const ad=document.createElement("div");ad.className="history-a"+(c?" correct":"");ad.textContent=c?"✓ 正解":a;r.append(qd,ad);$("history").prepend(r)}
function isCorrect(input,p){const t=norm(input);return p.success.some(g=>g.every(w=>t.includes(norm(w))))}
function judge(input,p){const t=norm(input);let y=p.yes.filter(k=>t.includes(norm(k))).length;let n=p.no.filter(k=>t.includes(norm(k))).length;if(y>n&&y>0)return"はい";if(n>y&&n>0)return"いいえ";return"関係ありません"}
function showTruth(p,head="真相"){$("truth").innerHTML="<strong>"+head+"</strong><p></p>";$("truth").querySelector("p").textContent=p.answer;$("truth").classList.remove("hidden")}
$("ask").onclick=()=>{if(solved)return setAns("この問題はクリア済み。次の問題へ！","correct");const input=$("question").value.trim();if(!input)return setAns("まず質問か推理を入力してね。","idle");const p=problems[current];qCount++;$("qCount").textContent=qCount;if(isCorrect(input,p)){solved=true;clearCount++;localStorage.setItem("umigame130_clear",clearCount);$("cCount").textContent=clearCount;addHist(input,"正解",true);setAns("🎉 正解！","correct");showTruth(p,"🎉 正解・真相");$("question").value="";return}const a=judge(input,p);addHist(input,a);setAns(a,a==="はい"?"yes":a==="いいえ"?"no":"neutral");$("question").value=""}
$("hint").onclick=()=>{const p=problems[current];const i=Math.min(hCount,p.hints.length-1);setAns("💡 "+p.hints[i],"hint");if(hCount<p.hints.length)hCount++;$("hCount").textContent=hCount}
$("reveal").onclick=()=>{if(confirm("真相を表示しますか？")){showTruth(problems[current]);setAns("真相を表示しました。","neutral")}}
$("next").onclick=()=>{current=(current+1)%problems.length;render()}
$("selector").onchange=e=>{current=Number(e.target.value);render()}
$("question").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")$("ask").click()})
problems.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+". "+p.title;$("selector").appendChild(o)});
render();
</script>
